[package]
name = "samara"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
futures-util = "0.3.31"
http = "1.4.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.45.1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["poll"] }

[dev-dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
# Compile-check the host-owned Ctrl-C policy in `examples/shane.rs` without
# making Tokio signal handling part of Samara's library dependency surface.
tokio = { version = "1.45.1", features = ["signal"] }
reqwest = { version = "*", features = ["json"] }
