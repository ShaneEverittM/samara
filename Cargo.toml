[package]
name = "samara"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
futures-util = "0.3.31"
tokio = { version = "1.45.1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }


[dev-dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
