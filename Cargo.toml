[workspace]
resolver = "3"
members = [
    "examples/api_pressure",
    "examples/framed_socket",
    "examples/minimal",
    "examples/time", "examples/url",
]
default-members = [
    ".",
    "examples/api_pressure",
    "examples/framed_socket",
    "examples/minimal",
    "examples/time",
]

[package]
name = "samara"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
futures-util = "0.3.31"
http = "1.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.45.1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["poll"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.45.1", features = ["test-util"] }
